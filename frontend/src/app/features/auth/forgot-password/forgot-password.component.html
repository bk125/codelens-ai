<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-hex">CL</div>
      <div class="brand-text">CodeLens <span class="brand-ai">AI</span></div>
    </div>

    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-sub">Enter your email to receive a reset link</p>

    <div *ngIf="message" [class]="isError ? 'error-banner' : 'success-banner'">
      {{ message }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field">
        <label class="field-label">Email Address</label>
        <input
          type="email"
          formControlName="email"
          class="field-input"
          placeholder="name@company.com"
          [disabled]="loading"
        >
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
        <span *ngIf="!loading">Send Reset Link</span>
        <div *ngIf="loading" class="loading-text">
          <div class="spinner"></div>
          <span>Sending...</span>
        </div>
      </button>
    </form>

    <div class="auth-footer">
      Remember your password? <a routerLink="/login" class="auth-link">Back to Login</a>
    </div>
  </div>
</div>
