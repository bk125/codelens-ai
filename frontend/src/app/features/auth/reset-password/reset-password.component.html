<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-hex">CL</div>
      <div class="brand-text">CodeLens <span class="brand-ai">AI</span></div>
    </div>

    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-sub">Enter your new secure password</p>

    <div *ngIf="message" [class]="isError ? 'error-banner' : 'success-banner'">
      {{ message }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field">
        <label class="field-label">New Password</label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="newPassword"
            class="field-input"
            placeholder="Min. 8 chars, 1 letter, 1 number, 1 special"
            [disabled]="loading"
          >
          <button class="view-password-btn" (click)="togglePasswordVisibility()" type="button">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || loading">
        <span *ngIf="!loading">Update Password</span>
        <div *ngIf="loading" class="loading-text">
          <div class="spinner"></div>
          <span>Updating...</span>
        </div>
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login" class="auth-link">Back to Login</a>
    </div>
  </div>
</div>
