<div class="auth-page">

  <button class="theme-toggle-corner" (click)="themeService.toggle()"
    [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
    <span *ngIf="themeService.isDark()">&#9728;</span>
    <span *ngIf="!themeService.isDark()">&#9790;</span>
  </button>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-hex">CL</div>
      <span class="brand-text">CodeLens <span class="brand-ai">AI</span></span>
    </div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to continue reviewing code</p>
    <div class="error-banner" *ngIf="error()">
      <span>&#9888; {{ error() }}</span>
    </div>
    <form class="auth-form" (ngSubmit)="submit()">
      <div class="field">
        <label class="field-label">Email</label>
        <input class="field-input" type="email" [(ngModel)]="email" name="email"
          placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" [(ngModel)]="password" name="password"
          placeholder="••••••••" autocomplete="current-password" required />
        <div style="text-align: right; margin-top: 0.5rem;">
          <a routerLink="/forgot-password" class="auth-link" style="font-size: 0.75rem;">Forgot Password?</a>
        </div>
      </div>
      <button class="btn-submit" type="submit" [disabled]="isLoading() || !email || !password">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()" class="loading-text"><span class="spinner"></span> Signing in...</span>
      </button>
    </form>
    <p class="auth-footer">Don't have an account? <a routerLink="/register" class="auth-link">Create one</a></p>
  </div>
</div>
